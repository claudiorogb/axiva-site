<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b192c"><meta name="robots" content="noindex,nofollow"><title>Entre em contato | AXIVA CRM</title><link rel="icon" href="/axiva-mark.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles.css">
<style>body{background:#f5f8fc;color:#0b192c}.contact-shell{max-width:620px;margin:42px auto 70px;padding:0 18px}.contact-panel{background:#fff;border:1px solid #dce5ee;box-shadow:0 12px 40px #0b192c0b;border-radius:18px;padding:34px}.contact-panel h1{font-size:clamp(1.7rem,4vw,2.3rem);margin:8px 0}.contact-panel p{color:#526276;line-height:1.6}.contact-panel p a{color:#155eef;text-decoration:underline;text-underline-offset:2px;font-weight:600}.contact-panel p a:hover,.contact-panel p a:focus-visible{color:#0046bb}.contact-panel label.field-label{display:block;font-weight:700;margin:22px 0 7px}.contact-panel input[type=text],.contact-panel input[type=email]{width:100%;padding:13px 14px;border:1px solid #b8c7d6;border-radius:8px;font:inherit;box-sizing:border-box}.contact-panel input:focus-visible,.contact-panel button:focus-visible,.contact-panel a:focus-visible{outline:3px solid #00a88f;outline-offset:2px}.contact-panel button{width:100%;border:0;background:#009b86;color:white;border-radius:9px;padding:15px;font-size:1rem;font-weight:700;cursor:pointer}.contact-panel button:disabled{opacity:.6;cursor:wait}.contact-status{min-height:24px;margin-top:15px}.contact-status.error{color:#ae2531}.contact-hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}.contact-back{display:inline-block;margin-bottom:14px;color:#0b6f6d}@media(max-width:550px){.contact-shell{margin-top:22px}.contact-panel{padding:24px 19px}}</style>
</head><body><main class="contact-shell"><a href="/crm" class="contact-back">← Voltar ao AXIVA CRM</a><section class="contact-panel"><span class="eyebrow">AXIVA CRM</span><h1>Entre em contato</h1><p>Preencha seus dados e teste o AXIVA CRM grátis por 30 dias.</p><form id="commercial-contact"><label class="field-label" for="contact-name">Seu nome</label><input id="contact-name" name="name" type="text" autocomplete="name" maxlength="120" required><label class="field-label" for="contact-email">Seu e-mail</label><input id="contact-email" name="email" type="email" autocomplete="email" maxlength="254" required><label class="field-label" for="contact-company">Nome da empresa</label><input id="contact-company" name="company" type="text" autocomplete="organization" maxlength="160" required><div class="contact-hp" aria-hidden="true"><label for="contact-site">Seu site</label><input id="contact-site" name="website" type="text" tabindex="-1" autocomplete="off"></div><label class="contact-optin" for="contact-optin"><input id="contact-optin" name="marketing_opt_in" type="checkbox"><span>Quero receber dicas práticas de como vender mais por e-mail. Posso cancelar a inscrição a qualquer momento.</span></label><p>Seus dados serão usados para responder ao contato. Consulte nossa <a href="/privacidade/" target="_blank" rel="noopener noreferrer">Política de Privacidade</a>.</p><button id="contact-submit" type="submit">Enviar contato</button><p id="contact-status" class="contact-status" role="status" aria-live="polite"></p></form></section></main><script>
(()=>{'use strict';const API='https://lhnzpxjjfalxmlkjysor.supabase.co/functions/v1/axiva-crm-contact';const form=document.getElementById('commercial-contact');const button=document.getElementById('contact-submit');const status=document.getElementById('contact-status');form.addEventListener('submit',async event=>{event.preventDefault();if(!form.reportValidity())return;button.disabled=true;status.classList.remove('error');status.textContent='Enviando...';try{const payload={name:form.elements.name.value.trim(),email:form.elements.email.value.trim(),company:form.elements.company.value.trim(),marketing_opt_in:form.elements.marketing_opt_in.checked,website:form.elements.website.value};const response=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),cache:'no-store',referrerPolicy:'no-referrer'});const result=await response.json().catch(()=>({}));if(!response.ok||!result.ok)throw Error(result.error||'Não foi possível enviar. Tente novamente.');form.reset();status.textContent='Contato recebido! Nossa equipe retornará pelo e-mail informado.';}catch(error){status.classList.add('error');status.textContent=error.message||'Não foi possível enviar. Tente novamente.';}finally{button.disabled=false;}})})();
</script></body></html>
