<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#0b192c"><title>Cancelar inscrição | AXIVA CRM</title><link rel="icon" href="/axiva-mark.svg" type="image/svg+xml"><style>:root{font-family:Inter,Arial,Helvetica,sans-serif;color:#0b192c;color-scheme:light}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:20px;background:#f5f8fc}main{width:min(100%,540px);padding:34px;background:#fff;border:1px solid #dce5ee;border-radius:16px;box-shadow:0 12px 40px rgba(15,23,42,.08)}.brand{display:flex;align-items:center;gap:10px;color:#0b192c;text-decoration:none;font-weight:800;font-size:20px}.brand img{width:32px;height:32px}h1{font-size:27px;line-height:1.25;margin:28px 0 14px}p{font-size:15px;line-height:1.65;color:#475569;margin:0 0 15px}button{width:100%;padding:14px 18px;border:0;border-radius:9px;background:#0b192c;color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px}button:disabled{opacity:.6;cursor:wait}.error{color:#a12436}.hidden{display:none!important}@media(max-width:480px){main{padding:26px 22px}h1{font-size:24px}}</style></head>
<body><main aria-live="polite"><a class="brand" href="/"><img src="/axiva-mark.svg" alt="">AXIVA</a><h1 id="title">Cancelar inscrição</h1><p id="description">Ao confirmar, você deixará de receber campanhas de e-mail da empresa que enviou a mensagem. O cancelamento não afeta sua inscrição em outras empresas.</p><button id="confirm" type="button">Confirmar descadastro</button><p id="status" role="status"></p></main>
<script>
(()=>{'use strict';const title=document.getElementById('title'),description=document.getElementById('description'),button=document.getElementById('confirm'),status=document.getElementById('status');const token=new URLSearchParams(location.hash.slice(1)).get('token')||'';history.replaceState(null,'',location.pathname);if(!/^[a-fA-F0-9]{8}-(?:[a-fA-F0-9]{4}-){3}[a-fA-F0-9]{12}$/.test(token)){title.textContent='Link de descadastro inválido';description.textContent='Utilize o link de cancelamento recebido no seu e-mail ou entre em contato com a empresa remetente.';button.classList.add('hidden');return}button.addEventListener('click',async()=>{button.disabled=true;status.textContent='Processando o descadastro...';try{const response=await fetch('https://lhnzpxjjfalxmlkjysor.supabase.co/functions/v1/email-unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token}),cache:'no-store',referrerPolicy:'no-referrer'});const data=await response.json().catch(()=>({}));if(!response.ok||!data.ok)throw Error('Falha');title.textContent='Inscrição cancelada';description.textContent='Seu e-mail foi descadastrado das campanhas desta empresa. Você não receberá novas mensagens de marketing dela por meio do AXIVA CRM.';button.classList.add('hidden');status.textContent='Descadastro confirmado.'}catch{button.disabled=false;status.className='error';status.textContent='Não foi possível concluir. Confira o link ou entre em contato com a empresa remetente.'}})})();
</script></body></html>
