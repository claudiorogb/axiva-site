<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="referrer" content="no-referrer">
  <title>Cancelamento de inscrição | AXIVA CRM</title>
  <style>
    :root{color-scheme:light;font-family:Arial,Helvetica,sans-serif}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:#f8fafc;color:#0b192c}
    main{width:min(100%,560px);padding:36px 32px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 12px 40px rgba(15,23,42,.08)}
    .mark{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#e3f8f3;color:#087b63;font-size:26px;font-weight:700}
    h1{font-size:26px;line-height:1.25;margin:24px 0 14px}
    p{font-size:16px;line-height:1.65;color:#475569;margin:0 0 15px}
    p:last-child{margin-bottom:0}
    @media(max-width:480px){main{padding:28px 24px}h1{font-size:24px}}
  </style>
</head>
<body>
  <main role="status" aria-live="polite">
    <span class="mark" aria-hidden="true" id="mark">…</span>
    <h1 id="title">Verificando cancelamento</h1>
    <div id="details"><p>Aguarde enquanto confirmamos sua solicitação.</p></div>
  </main>
  <script>
    (async () => {
      const title = document.getElementById('title');
      const details = document.getElementById('details');
      const mark = document.getElementById('mark');
      const token = new URLSearchParams(location.hash.slice(1)).get('token') || '';
      // Never retain the private token in browser history or send it to the website server.
      history.replaceState(null, '', location.pathname);
      if (!/^[0-9a-fA-F-]{36}$/.test(token)) {
        mark.textContent = '!'; title.textContent = 'Link inválido';
        details.textContent = 'Utilize o link de cancelamento recebido no seu e-mail.';
        return;
      }
      try {
        const response = await fetch('https://lhnzpxjjfalxmlkjysor.supabase.co/functions/v1/email-unsubscribe', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token }), cache: 'no-store', referrerPolicy: 'no-referrer'
        });
        if (!response.ok) throw new Error('invalid');
        const result = await response.json();
        if (!result?.ok) throw new Error('invalid');
        mark.textContent = '✓'; title.textContent = 'Inscrição cancelada';
        details.replaceChildren();
        for (const sentence of [
          'Seu endereço de e-mail foi descadastrado com sucesso.',
          'Você não receberá novas campanhas de e-mail desta empresa por meio do AXIVA CRM.',
          'Se você continuar recebendo mensagens, entre em contato diretamente com a empresa remetente.'
        ]) { const p = document.createElement('p'); p.textContent = sentence; details.append(p); }
      } catch {
        mark.textContent = '!'; title.textContent = 'Não foi possível confirmar';
        details.textContent = 'Este link é inválido ou está indisponível. Utilize o link recebido no e-mail ou entre em contato com a empresa remetente.';
      }
    })();
  </script>
</body>
</html>
