name: Apply CRM trial CTAs once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[skip crm cta]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update CRM CTA buttons
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crm/index.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''<div class="hero-actions">\n            <a class="btn btn-primary" href="/crm/precos/">Conhecer planos</a>\n            \n          </div>''',
                  '''<div class="hero-actions">\n            <a class="btn btn-primary" href="/crm/precos/">Conhecer planos</a>\n            <a class="btn btn-secondary" href="https://crm.axiva.com.br/?trial=1">Testar grátis por 30 dias</a>\n          </div>'''
              ),
              (
                  '''<div class="resources-cta"><a class="btn btn-primary" href="/crm/precos/">Conhecer planos</a></div>''',
                  '''<div class="resources-cta"><div style="display:flex;flex-wrap:wrap;justify-content:center;gap:12px"><a class="btn btn-primary" href="/crm/precos/">Conhecer planos</a><a class="btn btn-secondary" href="https://crm.axiva.com.br/?trial=1">Testar grátis por 30 dias</a></div></div>'''
              ),
              (
                  '''<a class="btn btn-primary" href="/crm/precos/">Conhecer planos</a>\n      </div>''',
                  '''<div style="display:flex;flex-wrap:wrap;gap:12px"><a class="btn btn-primary" href="/crm/precos/">Conhecer planos</a><a class="btn btn-secondary" href="https://crm.axiva.com.br/?trial=1">Testar grátis por 30 dias</a></div>\n      </div>'''
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected CRM CTA snippet not found: {old[:80]}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-crm-trial-ctas-once.yml
          git add crm/index.html .github/workflows/apply-crm-trial-ctas-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: add CRM 30-day trial CTAs [skip crm cta]"
          git push
