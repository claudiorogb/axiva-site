name: Corrigir redefinicao de senha AXIVA Invest
on:
  push:
    paths:
      - .github/workflows/fix-invest-password-recovery.yml
permissions:
  contents: write
jobs:
  fix-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Corrigir interface e fluxo de recuperacao
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html_path=Path('invest/private.html')
          js_path=Path('invest/private.js')
          html=html_path.read_text()
          js=js_path.read_text()
          assert 'id="resetView"' not in html
          assert 'const supabase=createClient(' in js
          assert "if(session)await loadPrivateArea();else showLogin()" in js
          assert "$('forgotBtn').addEventListener('click'" in js
          reset_html='''<div id="resetView" class="login-view hidden">
            <div class="login-shell">
              <div class="login-brand"><img src="/axiva-mark.svg" alt="AXIVA"><div><strong>AXIVA Invest</strong><span>Recuperação de acesso</span></div></div>
              <div class="login-card">
                <div class="login-kicker">SEGURANÇA DA CONTA</div>
                <h1>Defina sua nova senha</h1>
                <p>Escolha uma senha com pelo menos 8 caracteres e confirme para concluir a recuperação.</p>
                <form id="resetForm">
                  <label>Nova senha<input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></label>
                  <label>Confirme a nova senha<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label>
                  <button id="resetSubmit" type="submit">Salvar nova senha</button>
                </form>
                <div id="resetMessage" class="message" role="status" aria-live="polite"></div>
              </div>
              <a class="back-link" href="/invest/">← Voltar para AXIVA Invest</a>
            </div>
          </div>

          '''
          html=html.replace('<div id="appView" class="app-view hidden">',reset_html+'<div id="appView" class="app-view hidden">',1)
          html=html.replace('/invest/private.js?v=3','/invest/private.js?v=4',1)
          js=js.replace('const supabase=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})', '''// Guardar o tipo do link antes de o cliente Auth limpar o fragmento da URL.
          let recoveryMode=new URLSearchParams(location.hash.slice(1)).get('type')==='recovery' || new URLSearchParams(location.search).get('type')==='recovery'
          const supabase=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})''',1)
          js=js.replace("function showLogin(msg=''){loginView.classList.remove('hidden');appView.classList.add('hidden');loginMessage.textContent=msg}","function showLogin(msg=''){loginView.classList.remove('hidden');appView.classList.add('hidden');$('resetView').classList.add('hidden');loginMessage.textContent=msg}",1)
          js=js.replace("function showApp(){loginView.classList.add('hidden');appView.classList.remove('hidden')}",'''function showApp(){if(recoveryMode){showResetView();return}loginView.classList.add('hidden');$('resetView').classList.add('hidden');appView.classList.remove('hidden')}
          function showResetView(){loginView.classList.add('hidden');appView.classList.add('hidden');$('resetView').classList.remove('hidden')}
          // O link de recuperação cria uma sessão temporária; não significa que a senha já foi alterada.
          supabase.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){recoveryMode=true;showResetView()}})
          $('resetForm').addEventListener('submit',async e=>{
            e.preventDefault()
            const pass=$('newPassword').value,confirmPass=$('confirmPassword').value
            const message=$('resetMessage'),btn=$('resetSubmit')
            if(pass.length<8){message.textContent='Use uma senha com pelo menos 8 caracteres.';return}
            if(pass!==confirmPass){message.textContent='As senhas informadas não são iguais.';return}
            btn.disabled=true;message.textContent='Salvando sua nova senha...'
            try{
              const {data:{session}}=await supabase.auth.getSession()
              if(!session){message.textContent='O link expirou. Solicite uma nova recuperação de senha.';return}
              const {error}=await supabase.auth.updateUser({password:pass})
              if(error){message.textContent='Não foi possível alterar a senha. Confira os requisitos ou solicite um novo link.';return}
              await supabase.auth.signOut()
              recoveryMode=false
              $('resetForm').reset()
              history.replaceState(null,'',location.pathname)
              showLogin('Senha alterada com sucesso. Entre usando sua nova senha.')
            }catch(e){message.textContent='Não foi possível alterar a senha agora. Tente novamente.'}
            finally{btn.disabled=false}
          })''',1)
          js=js.replace("if(session)await loadPrivateArea();else showLogin()", "if(recoveryMode){if(session)showResetView();else showLogin('Link inválido ou expirado. Solicite uma nova recuperação de senha.')}else if(session)await loadPrivateArea();else showLogin()",1)
          assert 'resetPasswordForEmail(email' in js
          assert 'PASSWORD_RECOVERY' in js and 'auth.updateUser({password:pass})' in js
          assert 'if(recoveryMode){if(session)showResetView()' in js
          html_path.write_text(html)
          js_path.write_text(js)
          print('Recuperacao corrigida: formulario de nova senha, bloqueio do painel e confirmacao de senha.')
          PY
          node --input-type=module --check < invest/private.js
          git diff --check
          git diff --stat
      - name: Publicar correção na main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invest/private.html invest/private.js
          git commit -m "Exibir redefinicao de senha antes de abrir area exclusiva"
          git push origin main