name: Aplicar detalhes da selecao Invest
on:
  push:
    paths:
      - '.github/workflows/apply-invest-selection-detail-pages.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar e validar os arquivos
        run: |
          python3 scripts/patch-invest-detail-installer.py
          python3 scripts/apply-invest-selection-details.py
          node --check invest/private.js
          node --check invest/selection-details.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add invest/private.html invest/private.css invest/private.js
          git commit -m 'Ativar detalhes do ranking privado e resumo de fundamentos'
          git push
