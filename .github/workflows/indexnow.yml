name: IndexNow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build URL list
        id: urls
        shell: bash
        run: |
          set -euo pipefail

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            CHANGED="index.html
crm/index.html
invest/index.html"
          else
            CHANGED="$(git diff --name-only "$BEFORE" "$AFTER" || true)"
          fi

          urls=()

          if echo "$CHANGED" | grep -Eq '(^|/)(index\.html)$|^(styles\.css|home\.css|home-data\.js|axiva-.*|favicon.*)$'; then
            urls+=("https://axiva.com.br/")
          fi

          if echo "$CHANGED" | grep -Eq '^crm/'; then
            urls+=("https://axiva.com.br/crm")
          fi

          if echo "$CHANGED" | grep -Eq '^invest/'; then
            urls+=("https://axiva.com.br/invest")
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            urls=("https://axiva.com.br/" "https://axiva.com.br/crm" "https://axiva.com.br/invest")
          fi

          if [ "${#urls[@]}" -eq 0 ]; then
            echo 'json=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          json="$(printf '%s\n' "${urls[@]}" | jq -R . | jq -s -c .)"
          echo "json=$json" >> "$GITHUB_OUTPUT"

      - name: Submit changed URLs to IndexNow
        if: steps.urls.outputs.json != '[]'
        shell: bash
        env:
          INDEXNOW_URLS: ${{ steps.urls.outputs.json }}
        run: |
          set -euo pipefail

          payload="$(jq -n             --arg host "axiva.com.br"             --arg key "474b4239f8e8244ac96affd353bd1a2c"             --arg keyLocation "https://axiva.com.br/474b4239f8e8244ac96affd353bd1a2c.txt"             --argjson urlList "$INDEXNOW_URLS"             '{host:$host,key:$key,keyLocation:$keyLocation,urlList:$urlList}')"

          status="$(curl -sS -o /tmp/indexnow-response.txt -w '%{http_code}'             -X POST 'https://api.indexnow.org/indexnow'             -H 'Content-Type: application/json; charset=utf-8'             --data "$payload")"

          cat /tmp/indexnow-response.txt || true
          echo "HTTP status: $status"

          case "$status" in
            200|202) exit 0 ;;
            *) exit 1 ;;
          esac
