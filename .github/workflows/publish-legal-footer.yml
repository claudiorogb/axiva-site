name: Publicar rodapes legais AXIVA
on:
  push:
    paths:
      - .github/workflows/publish-legal-footer.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Inserir links aprovados sem alterar outras secoes
        run: python3 scripts/add-legal-footer.py
      - name: Verificar os dois documentos e links
        run: |
          test -f privacidade/index.html
          test -f termos/index.html
          grep -q '/privacidade' crm/index.html
          grep -q '/termos' crm/index.html
          grep -q '/privacidade' index.html
          grep -q '/termos' index.html
      - name: Salvar rodapes no repositorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crm/index.html index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Adicionar links legais ao portal e a pagina CRM'
            git push
          fi
