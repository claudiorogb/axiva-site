name: Import AXIVA Invest from Lovable once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-invest-static-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror published AXIVA Invest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re, json, urllib.request, urllib.parse
          from html.parser import HTMLParser
          from pathlib import Path

          BASE = "https://pixel-perfect-canvas-9013.lovable.app/"
          ROOT = Path(".")
          INVEST = ROOT / "invest"
          INVEST.mkdir(exist_ok=True)

          ua = {"User-Agent": "Mozilla/5.0"}

          def get(url):
              req = urllib.request.Request(url, headers=ua)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read(), r.headers.get_content_type()

          html_bytes, _ = get(BASE)
          html = html_bytes.decode("utf-8", "replace")

          class P(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = set()
              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  for key in ("src","href"):
                      v = d.get(key)
                      if not v: continue
                      u = urllib.parse.urljoin(BASE, v)
                      if urllib.parse.urlparse(u).netloc == urllib.parse.urlparse(BASE).netloc:
                          self.urls.add(u)

          p = P(); p.feed(html)
          queue = list(p.urls)
          seen = set()
          text_ext = {".js",".mjs",".css",".json",".map",".html",".txt",".svg"}
          asset_path_re = re.compile(r'''["'(=]((?:/_build|/assets)/[^"'()\s?#]+)''')

          def local_path(url):
              parsed = urllib.parse.urlparse(url)
              path = parsed.path
              if path == "/":
                  return INVEST / "index.html"
              return ROOT / path.lstrip("/")

          while queue:
              url = queue.pop(0)
              if url in seen: continue
              seen.add(url)
              try:
                  data, ctype = get(url)
              except Exception as e:
                  print("WARN fetch", url, e)
                  continue
              lp = local_path(url)
              lp.parent.mkdir(parents=True, exist_ok=True)
              lp.write_bytes(data)
              suffix = lp.suffix.lower()
              if suffix in text_ext or ctype.startswith("text/") or "javascript" in ctype or "json" in ctype:
                  txt = data.decode("utf-8","replace")
                  for m in asset_path_re.finditer(txt):
                      u2 = urllib.parse.urljoin(BASE, m.group(1))
                      if u2 not in seen:
                          queue.append(u2)

          # Keep the page's own HTML at /invest.
          (INVEST / "index.html").write_text(html, encoding="utf-8")

          # Switch Vercel back to local serving, removing Lovable dependency.
          vercel = {
            "cleanUrls": True,
            "trailingSlash": False,
            "rewrites": [
              {"source": "/crm", "destination": "/crm/index.html"},
              {"source": "/crm/contato", "destination": "/crm/contato/index.html"},
              {"source": "/crm/o-que-e-crm", "destination": "/crm/o-que-e-crm/index.html"},
              {"source": "/invest", "destination": "/invest/index.html"}
            ],
            "headers": [
              {
                "source": "/crm-funil-real.svg",
                "headers": [
                  {"key": "Content-Type", "value": "image/jpeg"},
                  {"key": "Cache-Control", "value": "public, max-age=3600"}
                ]
              }
            ]
          }
          Path("vercel.json").write_text(json.dumps(vercel, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Verify mirrored page
        run: |
          set -e
          test -s invest/index.html
          grep -q "AXIVA" invest/index.html
          grep -q '"/invest"' vercel.json || grep -q '"source": "/invest"' vercel.json
          echo "Mirrored files:"
          find assets _build invest -type f 2>/dev/null | wc -l

      - name: Commit static copy and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-invest-static-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Serve AXIVA Invest locally without Lovable dependency"
          git push origin main
